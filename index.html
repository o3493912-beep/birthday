<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدية لكِ 🌅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#2c1544;--dusk:#6b3a7d;--rose:#f0709a;--amber:#ffa24d;--cream:#ffe9cf;
 --ui:'Tajawal',system-ui,sans-serif;--hand:'Aref Ruqaa','Amiri',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--plum);color:var(--cream);font-family:var(--ui);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.fill{position:fixed;inset:0}

/* ===== تنبيه تدوير الشاشة ===== */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--plum);align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px;font-size:20px}
#rotate i{font-size:64px;font-style:normal;display:block;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

/* ===== شاشة التحقق ===== */
#verify{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;padding:3vh 5vw;text-align:center;
 background:linear-gradient(#2c1544,#5a2f73 45%,#b5507f 85%,#ff9a5a)}
#verify h1{font-family:var(--hand);font-weight:700;font-size:clamp(24px,7vh,46px);line-height:1.3}
#verify p{opacity:.85;font-size:clamp(14px,3.4vh,20px)}
#chips{display:flex;flex-wrap:wrap;gap:1.6vh 1.4vw;justify-content:center;max-width:820px}
.chip{padding:1.6vh 2.2vw;border-radius:999px;border:1.5px solid rgba(255,233,207,.45);background:rgba(44,21,68,.35);font-size:clamp(14px,3.6vh,22px);transition:.35s}
.chip:hover{background:rgba(255,162,77,.25)}
.chip.good{background:var(--amber);color:var(--plum);border-color:var(--amber);box-shadow:0 0 28px rgba(255,162,77,.7);pointer-events:none}
.chip.bad{opacity:.3;text-decoration:line-through;pointer-events:none;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#dots{display:flex;gap:10px}#dots b{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--cream);transition:.4s}
#dots b.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 14px var(--amber)}
#toast{position:fixed;left:50%;bottom:9vh;transform:translate(-50%,10px);z-index:50;padding:1.2vh 26px;border-radius:14px;background:rgba(20,8,32,.85);font-size:clamp(16px,4vh,24px);opacity:0;transition:.35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== شاشة الانتقال السوداء ===== */
#blackout{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity 2.6s ease;display:flex;align-items:center;justify-content:center;padding:6vw}
#blackout.on{opacity:1;pointer-events:auto}
#bo{font-family:var(--hand);font-size:clamp(20px,6vh,38px);line-height:1.9;text-align:center;max-width:900px;transition:opacity 1.6s}
#bo span{display:block;opacity:0;transform:translateY(8px);transition:opacity 2s,transform 2s}
#bo span.on{opacity:1;transform:none}

/* ===== اللعبة ===== */
#stage{position:fixed;inset:0;z-index:1;direction:ltr;overflow:hidden;opacity:0;transition:opacity 2.6s;--p:0;
 background:linear-gradient(#3b1f5c 0%,#8a3f84 28%,#e8668a 55%,#ffa14f 80%,#ffd08a 100%)}
#stage.show{opacity:1}
#dusk{position:absolute;inset:0;background:linear-gradient(#1b0b30,#4a1f5e);opacity:calc(var(--p)*.5)}
#sun{position:absolute;left:58%;bottom:30vh;width:38vh;height:38vh;margin-left:-19vh;border-radius:50%;
 background:radial-gradient(circle,#fff6cf 0 22%,#ffc56e 40%,rgba(255,150,80,.35) 58%,transparent 72%);transform:translateY(calc(var(--p)*13vh));animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.12) saturate(1.1)}}
.layer{position:absolute;left:0;right:0;background-repeat:repeat-x;background-size:130vw 100%}
#l1{bottom:22vh;height:30vh}#l2{bottom:22vh;height:22vh}#l3{bottom:22vh;height:13vh}
#ground{position:absolute;left:0;right:0;bottom:0;height:24vh;background:
 radial-gradient(ellipse at center,rgba(255,190,140,.22) 0 .45vh,transparent .6vh) 0 0/17vw 7vh,
 linear-gradient(#4a2468,#2c1544 40%,#1d0c31);border-top:.4vh solid rgba(255,170,120,.35)}
#char{position:absolute;left:28%;bottom:18.5vh;width:15vh;height:25vh;transition:left 6s cubic-bezier(.45,0,.4,1)}
#char svg{width:100%;height:100%;overflow:visible;animation:bob .36s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1vh)}}
#shadow{position:absolute;left:12%;right:12%;bottom:-1vh;height:2.2vh;border-radius:50%;background:rgba(15,5,25,.45);filter:blur(3px)}
.legA,.legB,.armA,.armB{transform-origin:30px 62px;animation:swing .72s ease-in-out infinite alternate}
.legB,.armA{animation-direction:alternate-reverse}
.armA,.armB{transform-origin:30px 42px;animation-duration:.72s}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.tail{transform-origin:20px 16px;animation:sway .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
#char.stop *{animation-play-state:paused}

#hud{position:absolute;top:2.4vh;left:0;right:0;z-index:9;display:flex;justify-content:center;gap:2.4vw;direction:rtl;pointer-events:none}
#hud div{text-align:center;min-width:8vw;padding:.8vh 1.4vw;border-radius:12px;background:rgba(30,12,48,.35);backdrop-filter:blur(4px)}
#hud b{display:block;font-size:clamp(22px,6.5vh,40px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
#hud small{font-size:clamp(11px,2.6vh,15px);opacity:.8}
#msg{position:absolute;left:10%;right:10%;top:26%;z-index:6;text-align:center;direction:rtl;font-family:var(--hand);font-size:clamp(20px,6vh,38px);line-height:1.7;
 text-shadow:0 2px 18px rgba(40,10,60,.8);opacity:0;transition:opacity 1.4s}
#msg.on{opacity:1}
#msg span{display:inline-block;opacity:0;margin:0 .15em}
#msg.go span{animation:wIn 1.1s forwards}
@keyframes wIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.bar{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;transition:height 2.4s ease-in-out}
#barT{top:0}#barB{bottom:0}
#stage.cine .bar{height:13vh}

#env{position:absolute;left:112%;bottom:30vh;width:14vh;height:10vh;z-index:5;transition:left 4s ease-out,opacity .4s;animation:float 2.4s ease-in-out infinite alternate;
 background:linear-gradient(#f6c391,#e99a63);border-radius:4px;box-shadow:0 0 5vh rgba(255,190,110,.85)}
#env::before{content:"";position:absolute;inset:0 0 48% 0;background:#e08a55;clip-path:polygon(0 0,100% 0,50% 100%)}
#env.in{left:74%}
@keyframes float{to{transform:translateY(-1.6vh)}}

/* ===== الرسالة ===== */
#letter{position:fixed;z-index:20;overflow:hidden;perspective:1400px;border-radius:4px;cursor:pointer;direction:rtl;
 background:linear-gradient(#f6c391,#e99a63);transition:left 1.8s cubic-bezier(.6,0,.2,1),top 1.8s cubic-bezier(.6,0,.2,1),width 1.8s cubic-bezier(.6,0,.2,1),height 1.8s cubic-bezier(.6,0,.2,1),border-radius 1.8s,background 1.6s}
#letter[hidden]{display:none}
#letter.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
#letter.open{background:linear-gradient(#fff1de,#ffd9b0);cursor:default}
.flap{position:absolute;left:0;right:0;top:0;height:52%;background:#e08a55;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.3s ease-in-out,opacity .6s 1s}
.open .flap{transform:rotateX(180deg);opacity:0}
.tap{position:absolute;left:0;right:0;top:62%;text-align:center;font-family:var(--hand);font-size:clamp(24px,7vh,44px);color:var(--plum);opacity:0;transition:opacity 1s .9s}
.full .tap{opacity:1;animation:pulse 1.8s 2.6s ease-in-out infinite alternate}
.open .tap{opacity:0!important;animation:none;transition:opacity .5s}
@keyframes pulse{to{transform:scale(1.07)}}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:6vh 9vw;text-align:center;color:var(--plum);opacity:0}
.open .card{opacity:1;transition:opacity 1.2s 1s}
.card h2{font-family:var(--hand);font-size:clamp(26px,8.5vh,56px);line-height:1.3;color:#a3345f}
.card p{font-family:var(--hand);font-size:clamp(17px,4.9vh,30px);line-height:1.85;max-width:900px}
.card span{display:inline-block;opacity:0;margin:0 .14em}
.open .card span{animation:wIn 1.1s forwards}

#snd{position:fixed;top:2vh;right:2vw;z-index:45;width:42px;height:42px;border-radius:50%;background:rgba(30,12,48,.45);font-size:19px;backdrop-filter:blur(4px)}
#snd.off{opacity:.55}

/* ===== أزرار التحكم ===== */
.ctl{position:absolute;bottom:3.5vh;z-index:10;direction:ltr;padding:1.6vh 2.6vw;border-radius:999px;background:rgba(30,12,48,.5);border:1.5px solid rgba(255,233,207,.5);
 backdrop-filter:blur(6px);font-size:clamp(15px,4vh,24px);touch-action:none;opacity:0;pointer-events:none;transition:opacity 1.4s,background .2s,transform .15s}
#stage.play .ctl{opacity:1;pointer-events:auto}
#stage.cine .ctl{opacity:0;pointer-events:none}
#ctlB{left:3vw}#ctlF{right:3vw}
.ctl.on{background:rgba(255,162,77,.6);transform:scale(.95)}
#hint{position:absolute;left:0;right:0;bottom:5.5vh;z-index:9;text-align:center;direction:rtl;font-family:var(--hand);font-size:clamp(16px,4vh,26px);opacity:0;transition:opacity 1.2s;pointer-events:none}
#stage.play:not(.moved):not(.cine) #hint{opacity:.9}
#backMsg{position:absolute;left:12%;right:12%;top:46%;z-index:6;text-align:center;direction:rtl;font-family:var(--hand);font-size:clamp(17px,4.8vh,30px);line-height:1.7;
 color:#ffd9e6;text-shadow:0 2px 18px rgba(40,10,60,.9);opacity:0;transition:opacity 1.2s;pointer-events:none}
#backMsg.on{opacity:1}
#backMsg span{display:inline-block;opacity:0;margin:0 .15em}
#backMsg.go span{animation:wIn 1.1s forwards}
#char.nope{animation:nope .5s}
@keyframes nope{20%,60%{transform:translateX(-1.2vh) rotate(-3deg)}40%,80%{transform:translateX(1.2vh) rotate(3deg)}}
#hY.tick{animation:tick .35s}
@keyframes tick{40%{transform:scale(1.14);color:#ffd08a}}

/* ===== إضافات: وضوح النصوص، أزهار، فوانيس، عقبات، ليل، كعكة ===== */
#wish,#skyMsg,#cHint{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:78%;text-align:center;direction:rtl;font-family:var(--hand);opacity:0;transition:opacity 1.2s;pointer-events:none}
#wish{top:35%;z-index:7;font-size:clamp(17px,4.6vh,29px);color:#fff1c9}
#skyMsg{top:22%;z-index:7;font-size:clamp(20px,6vh,38px);line-height:1.7;color:#f4f1ff}
#cHint{bottom:15vh;z-index:11;font-size:clamp(16px,4.2vh,26px);line-height:1.6}
#wish.on,#skyMsg.on,#cHint.on{opacity:1}
#wish span,#skyMsg span{display:inline-block;opacity:0;margin:0 .15em}
#wish.go span,#skyMsg.go span{animation:wIn 1.1s forwards}
/* خلفية داكنة شفافة خلف كل الجمل لتبقى مقروءة فوق الشمس */
#msg,#backMsg,#wish,#skyMsg,#cHint,.ol{padding:1.2vh 2.4vw;border-radius:2.2vh;background:rgba(22,8,38,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-shadow:0 1px 14px rgba(15,4,28,.95)}
#msg,#backMsg{left:50%;right:auto;width:max-content;max-width:78%;transform:translateX(-50%)}
#lc{position:absolute;top:2.4vh;left:2vw;z-index:9;padding:.9vh 1.4vw;border-radius:12px;background:rgba(30,12,48,.35);backdrop-filter:blur(4px);font-size:clamp(14px,3.4vh,20px);opacity:0;transition:opacity 1.4s}
#stage.play #lc{opacity:1}
#flowers i{position:absolute;font-style:normal;font-size:3.4vh;line-height:1;text-shadow:0 0 1.6vh currentColor;transform-origin:50% 100%;animation:bloom .9s ease-out both}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.lan{position:absolute;z-index:7;width:5.2vh;height:7vh;cursor:pointer;border-radius:1.2vh 1.2vh 2vh 2vh;background:radial-gradient(circle at 50% 60%,#fff4c4,#ffb347 55%,#e8734a);box-shadow:0 0 4vh rgba(255,180,80,.9);animation:lbob 2.2s ease-in-out infinite alternate}
.lan::before{content:"";position:absolute;left:50%;top:-3vh;width:1px;height:3vh;background:rgba(255,230,190,.6)}
.lan::after{content:"";position:absolute;inset:-2.5vh}
.lan.pop{animation:lpop .7s forwards;pointer-events:none}
@keyframes lbob{to{transform:translateY(-1.4vh)}}
@keyframes lpop{to{transform:scale(2.2);opacity:0}}
.rock{position:absolute;bottom:19vh;width:6vh;height:5.4vh;z-index:3;background:linear-gradient(#7b3a86,#4a2468);border-radius:48% 52% 8% 8%/70% 70% 10% 10%;box-shadow:inset 0 .6vh 0 rgba(255,190,150,.3)}
.ol{position:absolute;bottom:calc(100% + 2.5vh);left:50%;transform:translateX(-50%);width:max-content;max-width:36vh;text-align:center;direction:rtl;font-family:var(--hand);font-size:clamp(15px,3.8vh,24px);line-height:1.5;color:#fff1c9;opacity:0;transition:opacity 1s;pointer-events:none}
.rock.cleared .ol{opacity:1}
#char.jump{animation:jump 1.1s cubic-bezier(.3,.6,.5,1)}
@keyframes jump{0%{transform:translateY(0)}45%{transform:translateY(-11vh)}100%{transform:translateY(0)}}
/* سماء الليل */
#night{position:absolute;inset:0;background:linear-gradient(#050818,#1b1245 55%,#3a2260);opacity:0;transition:opacity 5s}
#stars{position:absolute;left:0;right:0;top:0;height:62%;opacity:0;transition:opacity 6s 1.5s;animation:twk 3s ease-in-out infinite alternate;
 background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,#ffe9cf 0 1.4px,transparent 2px),radial-gradient(circle,#cfe0ff 0 1px,transparent 1.6px);
 background-size:93px 71px,141px 113px,67px 89px;background-position:0 0,40px 30px,20px 55px}
@keyframes twk{to{filter:brightness(.55)}}
#moon{position:absolute;left:58%;bottom:40vh;width:16vh;height:16vh;margin-left:-8vh;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fffef5,#eef2ff 55%,#b9c4f0);
 box-shadow:0 0 6vh rgba(200,215,255,.75),0 0 14vh rgba(160,180,255,.35);transform:translateY(60vh);opacity:0;transition:transform 6s 1.5s ease-out,opacity 4s 1.5s}
.layer,#ground{transition:filter 5s}
.night #night{opacity:1}.night #stars{opacity:1}
.night #sun{transition:transform 4.5s ease-in;transform:translateY(75vh)}
.night #moon{transform:none;opacity:1}
.night .layer,.night #ground{filter:brightness(.42) saturate(.85)}
/* الكعكة والشمعة */
#cake{position:absolute;left:112%;bottom:21vh;width:17vh;height:20vh;z-index:5;cursor:pointer;transition:left 4s ease-out,opacity 1.2s}
#cake.in{left:74%}
#cake i{position:absolute;display:block}
.c1{left:0;right:0;bottom:0;height:7vh;border-radius:1.6vh;background:linear-gradient(#f7a3bb,#ee7d9f)}
.c2{left:12%;right:12%;bottom:6.4vh;height:6vh;border-radius:1.6vh 1.6vh .6vh .6vh;background:linear-gradient(#ffe2c6,#ffc79c)}
.wick{left:calc(50% - .5vh);bottom:12.2vh;width:1vh;height:5vh;border-radius:.4vh;background:#fff4e6}
.flame{left:calc(50% - 1vh);bottom:17vh;width:2vh;height:3.6vh;border-radius:50%/62% 62% 38% 38%;background:radial-gradient(#fffbd0,#ffb347 70%);box-shadow:0 0 3vh #ffb347;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.1,.9) rotate(4deg)}}
#cake.out .flame{opacity:0;transition:opacity .4s}
/* بطاقة الرسالة والحوار */
.card{justify-content:flex-start;overflow-y:auto}
#cc{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2.4vh;transition:opacity .6s}
#cc.fade{opacity:0}
.card p.long{font-size:clamp(15px,4vh,25px);line-height:1.8;max-width:1000px}
#acts{display:flex;gap:1.4vw;justify-content:center;flex-wrap:wrap}
.btn{padding:1.4vh 3vw;border-radius:999px;background:#a3345f;color:#ffe9cf;font-size:clamp(15px,3.8vh,22px);opacity:0;animation:wIn .9s forwards}
.btn:hover{background:#c2447a}
</style>
</head>
<body>

<div id="rotate"><i>📱</i><div>دوّري الهاتف بالعرض لتكتمل التجربة 🌅</div></div>
<canvas id="fx"></canvas>
<button id="snd" class="off" aria-label="الموسيقى">🎵</button>
<div id="toast"></div>

<!-- شاشة التحقق -->
<section id="verify">
  <h1 id="vTitle"></h1>
  <p id="vSub"></p>
  <div id="chips"></div>
  <div id="dots"><b></b><b></b><b></b></div>
</section>

<!-- اللعبة -->
<div id="stage">
  <div id="dusk"></div><div id="night"></div><div id="stars"></div><div id="sun"></div><div id="moon"></div>
  <div class="layer" id="l1"></div><div class="layer" id="l2"></div><div class="layer" id="l3"></div>
  <div id="ground"></div>
  <div id="flowers"></div><div id="things"></div>
  <div id="cake"><i class="c1"></i><i class="c2"></i><i class="wick"></i><i class="flame"></i></div>
  <div id="env"></div>
  <div id="char" class="stop">
    <div id="shadow"></div>
    <svg viewBox="0 0 60 100">
      <g class="armB"><line x1="30" y1="42" x2="30" y2="62" stroke="#ffd7b8" stroke-width="4.5" stroke-linecap="round"/></g>
      <g class="legB"><line x1="30" y1="62" x2="30" y2="94" stroke="#3a1f4d" stroke-width="6" stroke-linecap="round"/></g>
      <g class="legA"><line x1="30" y1="62" x2="30" y2="94" stroke="#4d2a63" stroke-width="6" stroke-linecap="round"/></g>
      <path d="M20 38h20l5 30H15z" fill="#f28aa5"/>
      <g class="armA"><line x1="30" y1="42" x2="30" y2="62" stroke="#ffd7b8" stroke-width="4.5" stroke-linecap="round"/></g>
      <path d="M21 37q9 6 18 0v5q-9 5-18 0z" fill="#ffb347"/>
      <g class="tail"><path d="M20 16q-14 2-12 18q3-10 14-10z" fill="#4a2a3a"/></g>
      <circle cx="30" cy="24" r="13" fill="#ffd7b8"/>
      <path d="M17 24q0-14 13-14t13 13q-8-3-13-9q-4 7-13 10z" fill="#4a2a3a"/>
      <circle cx="35.5" cy="25" r="1.6" fill="#2c1544"/><circle cx="37" cy="30" r="2.4" fill="#ff9aa8" opacity=".6"/>
    </svg>
  </div>
  <div id="msg"></div>
  <div id="backMsg"></div>
  <div id="wish"></div><div id="skyMsg"></div><div id="cHint"></div><div id="lc"></div>
  <div id="hint"></div>
  <button class="ctl" id="ctlB">◀ للخلف</button>
  <button class="ctl" id="ctlF">للأمام ▶</button>
  <div id="hud">
    <div><b id="hD">7</b><small>يوم</small></div>
    <div><b id="hM">10</b><small>شهر</small></div>
    <div><b id="hY">0</b><small>سنة</small></div>
  </div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
</div>

<div id="letter" hidden>
  <div class="flap"></div>
  <p class="tap">اضغط لتفتحها</p>
  <div class="card"><div id="cc"><h2 id="fTitle"></h2><p id="fText"></p><div id="acts"></div></div></div>
</div>

<div id="blackout"><p id="bo"></p></div>

<script>
/* =====================================================================
   ✏️  منطقة التعديل — كل النصوص والإعدادات هنا في الأعلى
   ===================================================================== */
const CONFIG = {
  name: "سميرة",
  birth: { day: 7, month: 10, year: 2010 },   // العداد يصعد من 0 إلى هذه السنة (عشرة بعشرة)
  hint: "اضغطي مطوّلاً على «للأمام» لتمشي. اضغطي عل فانوس لتفتحي رسالة",

/* ---------- تلال متدرجة (SVG مولّد) ---------- */
function hills(color, amp, base, seg, ph) {
  const W = 1600, H = 400; let d = `M0 ${H}`;
  for (let x = 0; x <= W; x += 20) {
    const t = 2 * Math.PI * seg * x / W;
    d += ` L${x} ${base + amp * Math.sin(t + ph) + amp * .4 * Math.sin(2 * t + ph * 2)}`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${W} ${H}Z" fill="${color}"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
$('l1').style.backgroundImage = hills('#b8508a', 60, 150, 2, 0);
$('l2').style.backgroundImage = hills('#7b3a86', 55, 170, 3, 1.6);

const cv = $('fx'), cx = cv.getContext('2d'); let P = [], DPR = 1;
function fit() { DPR = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
addEventListener('resize', fit); fit();
const spawn = (burst, x, y) => ({
  x: x ?? Math.random() * innerWidth, y: y ?? Math.random() * innerHeight,
  r: burst ? 2 + Math.random() * 4 : 1 + Math.random() * 3,
  vx: burst ? (Math.random() - .5) * 9 : (Math.random() - .5) * .25, vy: burst ? (Math.random() - .8) * 8 : -.1 - Math.random() * .3,
  tw: Math.random() * 6, life: burst ? 1 : null, hue: 25 + Math.random() * 30
});
for (let i = 0; i < 70; i++) P.push(spawn());
function burst(x = innerWidth / 2, y = innerHeight / 2, n = 120) { for (let i = 0; i < n; i++) P.push(spawn(true, x, y)); }
(function draw(t) {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight); cx.globalCompositeOperation = 'lighter';
  P = P.filter(p => p.life === null || p.life > 0);
  for (const p of P) {
    p.x += p.vx; p.y += p.vy;
    if (p.life !== null) { p.life -= .012; p.vy += .08; p.vx *= .985; }
    else { if (p.y < -10) { p.y = innerHeight + 10; p.x = Math.random() * innerWidth; } if (p.x < -10) p.x = innerWidth + 10; if (p.x > innerWidth + 10) p.x = -10; }
    const a = (p.life ?? 1) * (.35 + .35 * Math.sin(t / 700 + p.tw));
    const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    g.addColorStop(0, `hsla(${p.hue},100%,80%,${a})`); g.addColorStop(1, 'transparent');
    cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 4, 0, 6.3); cx.fill();
  }
  requestAnimationFrame(draw);
})(0);

/* ---------- موسيقى هادئة اختيارية (WebAudio) ---------- */
let ac = null, master = null, soundOn = false;
function startAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  [174.6, 220, 261.6, 329.6, 392].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sine'; o.frequency.value = f; g.gain.value = .05;
    l.frequency.value = .08 + i * .03; lg.gain.value = .03; l.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(master); o.start(); l.start();
  });
}
$('snd').onclick = () => {
  if (!ac) startAudio();
  soundOn = !soundOn; ac.resume();
  master.gain.linearRampToValueAtTime(soundOn ? .6 : 0, ac.currentTime + 1.2);
  $('snd').classList.toggle('off', !soundOn);
};

/* ---------- قفزة، عقبات، فوانيس، أزهار ---------- */
const things = $('things'), flowersEl = $('flowers');
let objs = [], nextObs = 0, nextLan = 0, lanGot = 0, jumpAt = -9999, flowerAcc = 0, hintOn = false, candleDone = null, micStream = null;
const charW = () => charEl.offsetWidth;
const airborne = now => { const t = now - jumpAt; return t > 180 && t < 780; };
function jump() {

function add(parent, el, k, kind, x0) { parent.appendChild(el); objs.push({ el, k, kind, x0, o0: off, x: x0 }); }
function spawnStuff(p, dt) {
  const OB = CONFIG.obstacleMessages, W = CONFIG.wishes;
  if (nextObs < OB.length && p >= .15 + nextObs * .7 / OB.length) {
    const el = document.createElement('div'); el.className = 'rock';
    el.innerHTML = `<div class="ol">${OB[nextObs++]}</div>`; add(things, el, 1, 'rock', innerWidth + 80);
  }
  if (nextLan < W.length && p >= .04 + (nextLan + .5) * .8 / W.length) {
    const el = document.createElement('div'), i = nextLan++; el.className = 'lan'; el.style.top = (40 + Math.random() * 9) + 'vh';
    el.onpointerdown = e => { e.stopPropagation(); collect(el, W[i]); }; add(things, el, .7, 'lan', innerWidth + 80);

    flowerAcc = 0; const f = document.createElement('i'); f.textContent = '✿';
    f.style.cssText = `color:${rnd(['#ff9ec0', '#ffd08a', '#fff1d6', '#ffb0e0'])};bottom:${17 + Math.random() * 3.5}vh`;

}
function updateObjs() {
  const c = charEl.offsetLeft + charW() * .5;
  objs = objs.filter(o => {

    if (o.kind === 'rock' && !o.done && o.x + o.el.offsetWidth / 2 < c) { o.done = 1; o.el.classList.add('cleared'); }
    if (o.x < -320) { o.el.remove(); return false; }
    return true;
  });
}

  const L = charEl.offsetLeft, W = charW(), c = L + W * .5, front = L + W * .7;
  let hit = false;

  hit = hit && !airborne(now);

}

/* ---------- حوار ما بعد الرسالة ---------- */
const rich = (el, txt, st) => { let i = 0; el.innerHTML = txt.split('\n').map(l => l.split(' ').map(w => `<span style="animation-delay:${(i++) * st}s">${w}</span>`).join(' ')).join('<br>'); };
function btn(label, fn) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.onclick = e => { e.stopPropagation(); fn(); }; return b; }
function setActs(list) { const a = $('acts'); a.innerHTML = ''; list.forEach(b => a.appendChild(b)); }
function step(i) {
  const s = CONFIG.chat[i], cc = $('cc'); cc.classList.add('fade');
  setTimeout(() => {
    $('fTitle').style.display = 'none'; setActs([]);
    const pEl = $('fText'); pEl.className = s.long ? 'long' : ''; rich(pEl, s.text, .12); cc.classList.remove('fade');
    const n = s.text.split(/\s+/).length;
    if (s.choices) setTimeout(() => setActs(s.choices.map(c => btn(c, () => step(i + 1)))), n * 120 + 1200);
    else burst();
  }, 700);
}

function startGame() { stage.classList.add('play'); last = performance.now(); requestAnimationFrame(loop); }

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .1); last = now;
  if (innerHeight > innerWidth) return;                       // متوقفة أثناء العرض العمودي
  if (state === 'walk') target = fwd ? 1 : 0;
  mul += (target - mul) * Math.min(1, dt * (state === 'walk' ? 3 : 1.2));
  if (state === 'walk' && blockedNow(now)) mul = 0;                      // عقبة أمامها: لا تتقدم قبل أن تقفز
  off += innerWidth * .12 * mul * dt * (state === 'walk' && airborne(now) ? 1.6 : 1);
  layers.forEach(([el, k]) => el.style.backgroundPositionX = (-off * k) + 'px');
  updateObjs();
  if (state !== 'walk') return;
  charEl.classList.toggle('stop', mul < .05);
  elapsed += dt * mul;
  const p = Math.min(elapsed / CONFIG.walkSeconds, 1);
  stage.style.setProperty('--p', p);
  spawnStuff(p, dt);
  tickYear(Math.floor(p * CONFIG.birth.year / 10 + 1e-9) * 10);   // العداد يزيد عشرة بعشرة
  const idx = Math.min(N - 1, Math.floor((p - .02) / (.94 / N)));
  if (p > .02 && idx > msgIdx) { msgIdx = idx; showMsg(M[idx]); }
  if (p >= 1) endScene();
}

async function endScene() {

  objs = objs.filter(o => o.kind === 'flower' || (o.el.remove(), false));
  ['msg', 'backMsg', 'wish', 'cHint'].forEach(id => $(id).classList.remove('on'));
  stage.classList.add('cine', 'night');                         // حواف سينمائية + سماء الليل والقمر
  await wait(5200);
  const sk = $('skyMsg'); words(sk, CONFIG.skyLine, .3); sk.className = 'go on';
  await wait(6500);
  $('cake').classList.add('in'); charEl.style.left = '55%'; charEl.classList.remove('stop');
  await wait(6200);
  charEl.classList.add('stop'); await wait(600);
  $('cHint').textContent = CONFIG.candleHint; $('cHint').className = 'on';
  await new Promise(r => { candleDone = r; listenBlow(); });
  await wait(2600);
  $('cake').style.opacity = 0; $('env').classList.add('in');
  await wait(4600);
  openLetter();
}

function openLetter() {
  const env = $('env'), L = $('letter'), r = env.getBoundingClientRect();
  Object.assign(L.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  L.hidden = false; env.style.opacity = 0; void L.offsetWidth;
  L.classList.add('full');
  $('fTitle').textContent = CONFIG.finalTitle;
  words($('fText'), CONFIG.finalText, .22);
  L.onclick = () => {
    if (!L.classList.contains('full') || L.classList.contains('open')) return;
    L.classList.add('open'); burst(); setTimeout(burst, 900);
    const n = CONFIG.finalText.split(' ').length;
    setTimeout(() => setActs([btn(CONFIG.moreBtn, () => step(0))]), (n * .22 + 3) * 1000);
  };
}
</script>
